name: Android-App bauen

# Baut die APK bei Änderungen an der App oder der Web-App (die im Direkt-Modus in der APK steckt).
# Wird auch vom Release-Workflow aufgerufen (workflow_call).
on:
  push:
    branches: [main]
    paths: ['app/**', 'server/web/**', '.github/workflows/app.yml']
  pull_request:
    paths: ['app/**', 'server/web/**', '.github/workflows/app.yml']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      # Ganze Historie: die Build-Nummer ist die Zahl der Commits
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # versionCode für Android: muss bei jedem neueren Stand steigen, auch zwischen normalen Builds und Releases.
      # Die Laufnummer taugt dafür nicht – jeder Workflow zählt für sich (Release #8 lag unter Build #27).
      - name: Build-Nummer
        run: echo "XENIOS_BUILD_NUMBER=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # Android SDK ist auf dem Runner vorinstalliert; nur Lizenzen akzeptieren
      - name: Android-SDK-Lizenzen
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.2'

      # Signaturschlüssel aus den Secrets (ohne Secrets: Debug-Signatur, Updates dann nicht möglich)
      - name: Signaturschlüssel bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.XENIOS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/xenios.jks"
            echo "XENIOS_KEYSTORE=$RUNNER_TEMP/xenios.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Keine Signatur-Secrets gesetzt – APK wird nur mit Debug-Schlüssel signiert."
          fi

      - name: APK bauen
        working-directory: app
        env:
          XENIOS_KEYSTORE_PASSWORD: ${{ secrets.XENIOS_KEYSTORE_PASSWORD }}
          XENIOS_KEY_ALIAS: ${{ secrets.XENIOS_KEY_ALIAS }}
          XENIOS_KEY_PASSWORD: ${{ secrets.XENIOS_KEY_PASSWORD }}
        run: gradle --no-daemon assembleUpdaterRelease assembleManuellRelease lintUpdaterRelease lintManuellRelease

      # Zwei Varianten (siehe app/app/build.gradle.kts). Der Name der Updater-APK bleibt Xenios-<Build>.apk:
      # danach suchen auch ältere Apps mit Updater.
      - name: APKs umbenennen
        run: |
          cp app/app/build/outputs/apk/updater/release/app-updater-release.apk "Xenios-$XENIOS_BUILD_NUMBER.apk"
          cp app/app/build/outputs/apk/manuell/release/app-manuell-release.apk "Xenios-$XENIOS_BUILD_NUMBER-ohne-Updater.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: Xenios-APK
          path: Xenios-*.apk
          retention-days: 30

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lint-report
          path: app/app/build/reports/lint-results-*.html
          if-no-files-found: ignore
